<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Square background, no rounded corners or border (CP0 store icon rule). -->
  <rect width="512" height="512" fill="#101014"/>

  <!-- Metronome body: a simple trapezoid. -->
  <polygon points="256,104 372,392 140,392" fill="#F2F2F2"/>
  <polygon points="256,104 256,392 140,392" fill="#D8D8D8"/>

  <!-- Base plate. -->
  <rect x="112" y="392" width="288" height="40" fill="#63E2B7"/>

  <!-- Pendulum rod, tilted to suggest motion. -->
  <line x1="256" y1="368" x2="318" y2="96"
        stroke="#101014" stroke-width="18" stroke-linecap="round"/>
  <!-- Sliding weight on the rod. -->
  <circle cx="290" cy="240" r="22" fill="#63E2B7" stroke="#101014" stroke-width="8"/>

  <!-- Three beat dots along the base. -->
  <circle cx="208" cy="412" r="9" fill="#101014"/>
  <circle cx="256" cy="412" r="9" fill="#101014"/>
  <circle cx="304" cy="412" r="9" fill="#101014"/>
</svg>
